name: CI

# Enforces the Definition of Done from AGENTS.md §5: a change is done only when it builds, its tests
# pass, and linters/formatters are clean — in CI, not just locally. Every command below is copied
# verbatim from README.md → "Build, Test & Run", which AGENTS.md §6 makes the single source for them.
# Actions are pinned to a full commit SHA with a version comment (AGENTS.md §7 / ADR-0004), enforced
# by scripts/check-workflow-pins.sh in the Convention checks workflow.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-test-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Tauri's Linux prerequisites (README → Prerequisites). The workspace does not
      # compile without them, because src-tauri links against webkit2gtk.
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libxdo-dev \
            pkg-config

      # rust-toolchain.toml pins the version and the components; rustup materialises it.
      - name: Set up the pinned Rust toolchain
        run: |
          rustup show active-toolchain
          cargo --version

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Test (Rust)
        run: cargo test

      - name: Test (frontend)
        run: bun test src-web

      - name: Lint
        run: cargo clippy --all-targets -- -D warnings

      - name: Format check
        run: cargo fmt --all --check

      # Compiles the Svelte components and the production bundle. The full desktop
      # bundle (`bun run tauri build`) is deliberately not a per-pull-request gate:
      # it is a release step and needs the bundler toolchain on every platform.
      - name: Build (frontend)
        run: bun run --cwd src-web build

# Flatpak manifest for GitGraph (ADR-0020), following the Tauri Flatpak guide:
# the module repacks the .deb produced by `tauri build` instead of rebuilding
# from source. The release workflow stages that .deb next to this manifest as
# `gitgraph.deb` before invoking flatpak-builder.
id: org.hivevm.gitgraph
runtime: org.gnome.Platform
runtime-version: '46'
sdk: org.gnome.Sdk
command: gitgraph

finish-args:
  # Window display (Wayland first, X11 fallback) and GPU-accelerated rendering.
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  - --share=ipc
  # GitGraph opens arbitrary local repositories and — by specification
  # Non-Goal — never writes to them: read-only host access instead of
  # per-folder portals, which git2 cannot use for whole-tree reads.
  - --filesystem=host:ro
  # Sole network use is the opt-in, default-off Gravatar avatar fetch
  # (ADR-0016); the WebView CSP allows no other origin.
  - --share=network

modules:
  - name: gitgraph
    buildsystem: simple
    build-commands:
      - ar -x gitgraph.deb
      - tar -xf data.tar.gz
      - install -Dm755 usr/bin/gitgraph /app/bin/gitgraph
      - install -Dm644 usr/share/applications/GitGraph.desktop /app/share/applications/org.hivevm.gitgraph.desktop
      - sed -i 's/^Icon=gitgraph$/Icon=org.hivevm.gitgraph/' /app/share/applications/org.hivevm.gitgraph.desktop
      - install -Dm644 usr/share/icons/hicolor/32x32/apps/gitgraph.png /app/share/icons/hicolor/32x32/apps/org.hivevm.gitgraph.png
      - install -Dm644 usr/share/icons/hicolor/128x128/apps/gitgraph.png /app/share/icons/hicolor/128x128/apps/org.hivevm.gitgraph.png
      - install -Dm644 usr/share/icons/hicolor/256x256@2/apps/gitgraph.png /app/share/icons/hicolor/256x256@2/apps/org.hivevm.gitgraph.png
    sources:
      - type: file
        path: gitgraph.deb
